# 4 the design approach and print, 5 the result. Pictures: 0 flat lay of festive covers, 1 brochure spread,
# 2 "Blessings in Bloom" cards, 3 Mid-Autumn booklet, 4 brochure fan, 5 "Crafting Festive Joy" in flight,
# 6 "Crafting Festive Joy" gold-foil close-up. (Its copied "Back to projects" link is left out by the template.)
sections:
