# Art direction for /shine-children-and-youth-services (src/lib/art.ts). Layout only: the page's own
# words and pictures, each used once. Paragraphs: 0 Nothing is Impossible 2021, 1 the brief, 2 Pop-Art
# logo, characters and poster, 3 Corporate Video heading, 4 Beneficiaries Videos heading. Pictures:
# 0 logo, 1 the two heroes, 2 digital poster (portrait), 3 website, 4 corporate video, 5-6 beneficiary
# videos.
# Moves: the portrait poster beside the passage that names it instead of at half width over empty
# paper; heroes and website as a pair; the two beneficiary videos side by side.
sections:
  - text: [0]
    layout: lead
  - text: [1]
    media: [0]
    layout: beside
  - text: [2]
    media: [2]
    layout: beside-left
  - media: [1, 3]
    layout: pair
  - text: [3]
  - media: [4]
    layout: full
  - text: [4]
  - media: [5, 6]
    layout: pair
